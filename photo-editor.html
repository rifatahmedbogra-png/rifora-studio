<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rifora Studio Professional Photo Editor">
<title>Photo Editor | Rifora Studio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#101525;
 --panel:#192238;
 --panel2:#202d46;
 --accent:#8b6cff;
 --text:#f5f6ff;
 --muted:#aab5ce;
 --border:#34415d;
}

body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

button,input,select{font:inherit}

button{
 cursor:pointer;
 border:0;
 border-radius:7px;
 padding:10px 13px;
 background:var(--panel2);
 color:white;
 transition:.2s;
}

button:hover{background:#394b70}
button:disabled{opacity:.4;cursor:not-allowed}

.topbar{
 min-height:66px;
 background:#151e32;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 20px;
 gap:12px;
 flex-wrap:wrap;
}

.brand{
 font-size:22px;
 font-weight:bold;
}
.brand span{color:#a994ff}

.top-actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.primary{
 background:var(--accent);
 color:white;
}
.primary:hover{background:#7252df}

.workspace{
 display:grid;
 grid-template-columns:245px minmax(0,1fr) 270px;
 min-height:calc(100vh - 66px);
}

.sidebar,.properties{
 background:var(--panel);
 padding:18px;
 overflow:auto;
}

.sidebar{border-right:1px solid var(--border)}
.properties{border-left:1px solid var(--border)}

.panel-title{
 font-size:14px;
 color:#c7baff;
 font-weight:bold;
 text-transform:uppercase;
 letter-spacing:1px;
 margin-bottom:17px;
}

.tool-section{
 margin-bottom:25px;
}

.tool-section h3{
 font-size:13px;
 color:var(--muted);
 margin-bottom:12px;
}

.tool-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.tool{
 min-height:73px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:7px;
 font-size:12px;
 border:1px solid var(--border);
}

.tool span{font-size:22px}

.tool.active{
 border-color:var(--accent);
 background:#302851;
}

.upload-box{
 border:1px dashed #8070b9;
 background:#25213b;
 border-radius:10px;
 padding:18px 10px;
 text-align:center;
 cursor:pointer;
 color:#ded6ff;
 font-size:13px;
 line-height:1.7;
}

.upload-box strong{
 display:block;
 font-size:28px;
}

.upload-box input{display:none}

.canvas-area{
 min-width:0;
 display:flex;
 flex-direction:column;
}

.canvas-toolbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 padding:12px 16px;
 background:#151e32;
 border-bottom:1px solid var(--border);
}

.canvas-toolbar button{font-size:12px}

.canvas-stage{
 flex:1;
 min-height:480px;
 padding:25px;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:auto;
 background-color:#101525;
 background-image:
 linear-gradient(45deg,#192238 25%,transparent 25%),
 linear-gradient(-45deg,#192238 25%,transparent 25%),
 linear-gradient(45deg,transparent 75%,#192238 75%),
 linear-gradient(-45deg,transparent 75%,#192238 75%);
 background-size:24px 24px;
 background-position:0 0,0 12px,12px -12px,-12px 0;
}

.canvas-wrap{
 background:white;
 box-shadow:0 10px 45px rgba(0,0,0,.35);
 line-height:0;
 max-width:100%;
}

canvas{
 display:block;
 max-width:100%;
 height:auto;
}

.empty-state{
 text-align:center;
 color:#aab5ce;
 line-height:1.8;
 max-width:340px;
}

.empty-state .big{font-size:60px}

.field{
 margin-bottom:19px;
}

.field label{
 display:flex;
 justify-content:space-between;
 font-size:13px;
 margin-bottom:9px;
 color:#e2e6f4;
}

.field input[type=range]{width:100%;accent-color:#a18aff}

.field input[type=text],
.field input[type=number],
.field select,
.field input[type=color]{
 width:100%;
 padding:10px;
 border-radius:7px;
 border:1px solid var(--border);
 background:#101a2d;
 color:white;
}

.field input[type=color]{
 height:42px;
 padding:4px;
}

.field input[type=number]{margin-top:8px}

.property-actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.property-actions button{font-size:12px}

.divider{
 height:1px;
 background:var(--border);
 margin:20px 0;
}

.status{
 padding:10px 15px;
 font-size:12px;
 color:var(--muted);
 background:#151e32;
 border-top:1px solid var(--border);
}

#imageInput{display:none}

@media(max-width:900px){
 .workspace{grid-template-columns:200px minmax(0,1fr)}
 .properties{
  grid-column:1/-1;
  border-left:0;
  border-top:1px solid var(--border);
 }
}

@media(max-width:600px){
 .workspace{display:flex;flex-direction:column}
 .sidebar,.properties{border:0;border-bottom:1px solid var(--border)}
 .canvas-stage{min-height:350px;padding:12px}
 .topbar{padding:12px}
}
</style>
</head>

<body>

<header class="topbar">
 <div class="brand">Rifora <span>Studio</span></div>
 <div class="top-actions">
  <button id="undoBtn" disabled>↶ Undo</button>
  <button id="redoBtn" disabled>↷ Redo</button>
  <button id="resetBtn">Reset</button>
  <button class="primary" id="downloadBtn">Download ⬇</button>
 </div>
</header>

<div class="workspace">

<aside class="sidebar">
 <div class="panel-title">Creative Tools</div>

 <div class="tool-section">
  <h3>IMPORT IMAGE</h3>
  <label class="upload-box" for="imageInput">
   <strong>＋</strong>
   Click to upload photo
   <br>JPG, PNG, WEBP
  </label>
  <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
 </div>

 <div class="tool-section">
  <h3>IMAGE TRANSFORM</h3>
  <div class="tool-grid">
   <button class="tool" id="rotateLeft"><span>↶</span>Rotate Left</button>
   <button class="tool" id="rotateRight"><span>↷</span>Rotate Right</button>
   <button class="tool" id="flipH"><span>↔</span>Flip Horizontal</button>
   <button class="tool" id="flipV"><span>↕</span>Flip Vertical</button>
  </div>
 </div>

 <div class="tool-section">
  <h3>PHOTO EFFECTS</h3>
  <div class="tool-grid">
   <button class="tool filter-btn" data-filter="normal"><span>◉</span>Normal</button>
   <button class="tool filter-btn" data-filter="grayscale"><span>◐</span>Grayscale</button>
   <button class="tool filter-btn" data-filter="sepia"><span>◒</span>Sepia</button>
   <button class="tool filter-btn" data-filter="vintage"><span>◍</span>Vintage</button>
  </div>
 </div>

 <div class="tool-section">
  <h3>DESIGN TOOLS</h3>
  <div class="tool-grid">
   <button class="tool" id="addTextBtn"><span>T</span>Add Text</button>
   <button class="tool" id="cropHint"><span>▣</span>Crop Guide</button>
  </div>
 </div>
</aside>

<main class="canvas-area">
 <div class="canvas-toolbar">
  <strong>Photo Workspace</strong>
  <div>
   <button id="zoomOut">−</button>
   <button id="zoomLabel">100%</button>
   <button id="zoomIn">＋</button>
  </div>
 </div>

 <div class="canvas-stage" id="canvasStage">
  <div class="empty-state" id="emptyState">
   <div class="big">🖼️</div>
   <h2>Your Canvas is Ready</h2>
   <p>Upload a photo to start editing with Rifora Studio.</p>
   <br>
   <button class="primary" id="startUpload">Upload Your Photo</button>
  </div>
  <div class="canvas-wrap" id="canvasWrap" style="display:none">
   <canvas id="editorCanvas" width="900" height="600"></canvas>
  </div>
 </div>

 <div class="status" id="status">Ready — Upload an image to begin.</div>
</main>

<aside class="properties">
 <div class="panel-title">Adjustments</div>

 <div class="field">
  <label>Brightness <span id="brightnessValue">100%</span></label>
  <input type="range" id="brightness" min="0" max="200" value="100">
 </div>

 <div class="field">
  <label>Contrast <span id="contrastValue">100%</span></label>
  <input type="range" id="contrast" min="0" max="200" value="100">
 </div>

 <div class="field">
  <label>Saturation <span id="saturationValue">100%</span></label>
  <input type="range" id="saturation" min="0" max="200" value="100">
 </div>

 <div class="field">
  <label>Blur <span id="blurValue">0px</span></label>
  <input type="range" id="blur" min="0" max="15" value="0">
 </div>

 <div class="divider"></div>

 <div class="panel-title">Add Text</div>

 <div class="field">
  <label>Text Content</label>
  <input type="text" id="textInput" placeholder="Type your text here">
 </div>

 <div class="field">
  <label>Font Size</label>
  <input type="number" id="fontSize" min="10" max="150" value="48">
 </div>

 <div class="field">
  <label>Text Color</label>
  <input type="color" id="textColor" value="#ffffff">
 </div>

 <div class="field">
  <label>Text Position</label>
  <select id="textPosition">
   <option value="center">Center</option>
   <option value="top">Top</option>
   <option value="bottom">Bottom</option>
  </select>
 </div>

 <button class="primary" id="applyText" style="width:100%">
  Add Text to Photo
 </button>

 <div class="divider"></div>

 <div class="panel-title">Export Image</div>

 <div class="field">
  <label>File Format</label>
  <select id="format">
   <option value="png">PNG</option>
   <option value="jpeg">JPG</option>
  </select>
 </div>

 <button class="primary" id="exportBtn" style="width:100%">
  Download Image
 </button>
</aside>

</div>

<script>
const canvas = document.getElementById("editorCanvas");
const ctx = canvas.getContext("2d");

const imageInput = document.getElementById("imageInput");
const emptyState = document.getElementById("emptyState");
const canvasWrap = document.getElementById("canvasWrap");
const statusBox = document.getElementById("status");

let photo = new Image();
let hasPhoto = false;

let settings = {
 brightness:100,
 contrast:100,
 saturation:100,
 blur:0,
 filter:"normal",
 rotation:0,
 flipH:false,
 flipV:false,
 zoom:100,
 texts:[]
};

let history = [];
let historyIndex = -1;

function status(message){
 statusBox.textContent = message;
}

function saveHistory(){
 if(!hasPhoto) return;

 history = history.slice(0,historyIndex+1);
 history.push(JSON.stringify(settings));

 if(history.length>30) history.shift();

 historyIndex=history.length-1;
 updateHistoryButtons();
}

function updateHistoryButtons(){
 document.getElementById("undoBtn").disabled=historyIndex<=0;
 document.getElementById("redoBtn").disabled=historyIndex>=history.length-1;
}

function restoreHistory(index){
 if(index<0 || index>=history.length) return;
 historyIndex=index;
 settings=JSON.parse(history[index]);
 syncControls();
 render();
 updateHistoryButtons();
}

function syncControls(){
 ["brightness","contrast","saturation","blur"].forEach(id=>{
  document.getElementById(id).value=settings[id];
  document.getElementById(id+"Value").textContent=
   settings[id]+(id==="blur"?"px":"%");
 });
}

function render(){
 if(!hasPhoto) return;

 const angle=((settings.rotation%360)+360)%360;
 const swap=angle===90 || angle===270;

 const width=swap?photo.naturalHeight:photo.naturalWidth;
 const height=swap?photo.naturalWidth:photo.naturalHeight;

 canvas.width=width;
 canvas.height=height;

 let filters=[];
 filters.push("brightness("+settings.brightness+"%)");
 filters.push("contrast("+settings.contrast+"%)");
 filters.push("saturate("+settings.saturation+"%)");
 filters.push("blur("+settings.blur+"px)");

 if(settings.filter==="grayscale") filters.push("grayscale(100%)");
 if(settings.filter==="sepia") filters.push("sepia(100%)");
 if(settings.filter==="vintage")
  filters.push("sepia(45%) contrast(110%) saturate(80%)");

 ctx.clearRect(0,0,width,height);
 ctx.save();
 ctx.translate(width/2,height/2);
 ctx.rotate(settings.rotation*Math.PI/180);
 ctx.scale(settings.flipH?-1:1,settings.flipV?-1:1);
 ctx.filter=filters.join(" ");

 ctx.drawImage(
  photo,
  -photo.naturalWidth/2,
  -photo.naturalHeight/2,
  photo.naturalWidth,
  photo.naturalHeight
 );

 ctx.restore();
 ctx.filter="none";

 settings.texts.forEach(item=>{
  ctx.save();
  ctx.font="bold "+item.size+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.lineWidth=Math.max(2,item.size/14);
  ctx.strokeStyle="rgba(0,0,0,.65)";
  ctx.fillStyle=item.color;
  ctx.strokeText(item.text,item.x,item.y);
  ctx.fillText(item.text,item.x,item.y);
  ctx.restore();
 });

 canvas.style.width=(width*settings.zoom/100)+"px";
 canvas.style.maxWidth="none";
 canvas.style.height="auto";

 status("Editing image — "+width+" × "+height+" pixels");
}

function uploadPhoto(file){
 if(!file) return;

 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
  alert("Please select a JPG, PNG or WEBP image.");
  return;
 }

 const reader=new FileReader();

 reader.onload=function(event){
  photo.onload=function(){
   hasPhoto=true;

   settings={
    brightness:100,
    contrast:100,
    saturation:100,
    blur:0,
    filter:"normal",
    rotation:0,
    flipH:false,
    flipV:false,
    zoom:100,
    texts:[]
   };

   emptyState.style.display="none";
   canvasWrap.style.display="block";

   history=[];
   historyIndex=-1;

   render();
   saveHistory();
   syncControls();

   status("Photo uploaded successfully.");
  };

  photo.src=event.target.result;
 };

 reader.readAsDataURL(file);
}

imageInput.addEventListener("change",function(){
 if(this.files && this.files[0]) uploadPhoto(this.files[0]);
 this.value="";
});

document.getElementById("startUpload").onclick=function(){
 imageInput.click();
};

document.getElementById("brightness").addEventListener("input",function(){
 settings.brightness=Number(this.value);
 document.getElementById("brightnessValue").textContent=this.value+"%";
 render();
});

document.getElementById("contrast").addEventListener("input",function(){
 settings.contrast=Number(this.value);
 document.getElementById("contrastValue").textContent=this.value+"%";
 render();
});

document.getElementById("saturation").addEventListener("input",function(){
 settings.saturation=Number(this.value);
 document.getElementById("saturationValue").textContent=this.value+"%";
 render();
});

document.getElementById("blur").addEventListener("input",function(){
 settings.blur=Number(this.value);
 document.getElementById("blurValue").textContent=this.value+"px";
 render();
});

["brightness","contrast","saturation","blur"].forEach(id=>{
 document.getElementById(id).addEventListener("change",saveHistory);
});

document.getElementById("rotateLeft").onclick=function(){
 if(!hasPhoto)return;
 settings.rotation-=90;
 render();saveHistory();
};

document.getElementById("rotateRight").onclick=function(){
 if(!hasPhoto)return;
 settings.rotation+=90;
 render();saveHistory();
};

document.getElementById("flipH").onclick=function(){
 if(!hasPhoto)return;
 settings.flipH=!settings.flipH;
 render();saveHistory();
};

document.getElementById("flipV").onclick=function(){
 if(!hasPhoto)return;
 settings.flipV=!settings.flipV;
 render();saveHistory();
};

document.querySelectorAll(".filter-btn").forEach(button=>{
 button.onclick=function(){
  if(!hasPhoto)return;
  settings.filter=this.dataset.filter;
  render();saveHistory();

  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  this.classList.add("active");
 };
});

document.getElementById("applyText").onclick=function(){
 if(!hasPhoto){
  alert("Please upload a photo first.");
  return;
 }

 const text=document.getElementById("textInput").value.trim();
 if(!text){
  alert("Please enter some text.");
  return;
 }

 const size=Math.max(10,Math.min(150,Number(document.getElementById("fontSize").value)||48));
 const position=document.getElementById("textPosition").value;

 let y=canvas.height/2;
 if(position==="top") y=size+15;
 if(position==="bottom") y=canvas.height-size-15;

 settings.texts.push({
  text:text,
  size:size,
  color:document.getElementById("textColor").value,
  x:canvas.width/2,
  y:y
 });

 render();
 saveHistory();
 status("Text added to photo.");
};

document.getElementById("undoBtn").onclick=function(){
 if(historyIndex>0) restoreHistory(historyIndex-1);
};

document.getElementById("redoBtn").onclick=function(){
 if(historyIndex<history.length-1) restoreHistory(historyIndex+1);
};

document.getElementById("resetBtn").onclick=function(){
 if(!hasPhoto)return;

 if(!confirm("Reset all editing changes?"))return;

 settings={
  brightness:100,
  contrast:100,
  saturation:100,
  blur:0,
  filter:"normal",
  rotation:0,
  flipH:false,
  flipV:false,
  zoom:100,
  texts:[]
 };

 document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));

 syncControls();
 render();
 saveHistory();
 status("Editing settings have been reset.");
};

document.getElementById("zoomIn").onclick=function(){
 if(!hasPhoto)return;
 settings.zoom=Math.min(200,settings.zoom+10);
 render();
 document.getElementById("zoomLabel").textContent=settings.zoom+"%";
};

document.getElementById("zoomOut").onclick=function(){
 if(!hasPhoto)return;
 settings.zoom=Math.max(30,settings.zoom-10);
 render();
 document.getElementById("zoomLabel").textContent=settings.zoom+"%";
};

document.getElementById("cropHint").onclick=function(){
 alert("Crop tool is planned for the next version. It will include free crop and aspect ratio controls.");
};

function downloadImage(){
 if(!hasPhoto){
  alert("Please upload a photo first.");
  return;
 }

 const format=document.getElementById("format").value;
 const mime=format==="jpeg"?"image/jpeg":"image/png";
 const data=canvas.toDataURL(mime,0.95);

 const link=document.createElement("a");
 link.href=data;
 link.download="rifora-edited-photo."+format;
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);

 status("Your edited photo has been downloaded.");
}

document.getElementById("downloadBtn").onclick=downloadImage;
document.getElementById("exportBtn").onclick=downloadImage;

</script>
</body>
</html>
